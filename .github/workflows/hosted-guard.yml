name: Hosted guard

# @riff/core is consumed by the private hosted build (ferdousbhai/riff-hosted)
# through a submodule it pins by commit. Without this job a core change only
# surfaces there whenever someone next bumps that pin. This runs the hosted
# checks against the core commit that just landed, so a break is reported by the
# commit that caused it.

on:
  push:
    branches: [master]
    paths:
      - "packages/core/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A separate job because `secrets` is not readable from a job-level `if`.
  key:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      # A read-only deploy key on riff-hosted, not a personal token: it grants
      # exactly this one private repo and is revoked by deleting it there.
      # Forks cannot read it, so the run reports a skip rather than a failure
      # nobody can fix.
      - id: probe
        env:
          HOSTED_REPO_SSH_KEY: ${{ secrets.HOSTED_REPO_SSH_KEY }}
        run: |
          if [ -n "$HOSTED_REPO_SSH_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOSTED_REPO_SSH_KEY is not set; skipping the hosted check."
          fi

  hosted-check:
    needs: key
    if: needs.key.outputs.available == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosted
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ferdousbhai/riff-hosted
          ssh-key: ${{ secrets.HOSTED_REPO_SSH_KEY }}
          submodules: recursive
          path: hosted

      - name: Point the vendored core at this commit
        working-directory: hosted/vendor/riff
        run: |
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Not --frozen-lockfile: the point of this job is to test a core commit
      # the hosted lockfile has not pinned yet.
      - run: pnpm install --no-frozen-lockfile

      - run: pnpm --filter @riff/web cf-typegen

      - run: pnpm run check
