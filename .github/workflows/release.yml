name: Native Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  arch-package:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 60

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install current Arch packaging tools
        run: >-
          pacman -Syu --noconfirm --needed
          appstream
          cairo
          cargo-auditable
          dbus
          desktop-file-utils
          gdk-pixbuf2
          git
          github-cli
          glib2
          gst-plugins-base
          gst-plugins-good
          gtk3
          hicolor-icon-theme
          jq
          libgcc
          libsoup3
          nodejs
          pacman-contrib
          rust
          webkit2gtk-4.1

      - name: Verify release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$version"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)" = "$version"
          test "$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)" = "$version"
          test "$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' packaging/com.soundspurple.Purple.metainfo.xml | head -1)" = "$version"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Verify the annotated release tag signature
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq 'select(.object.type == "tag") | .object.sha')"
          test -n "$tag_object"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')" = true

      # The GitHub source archive does not exist until its tag does. Refreshing
      # its checksum here avoids SKIP without creating a circular tag checksum.
      - name: Resolve and verify release sources
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -c "cd '$GITHUB_WORKSPACE/packaging' && updpkgsums"
          runuser -u builder -- bash -c "cd '$GITHUB_WORKSPACE/packaging' && makepkg --printsrcinfo > purple-music.SRCINFO"

      - name: Build and test the Arch package
        run: runuser -u builder -- bash -c "cd '$GITHUB_WORKSPACE/packaging' && makepkg --cleanbuild --force --noconfirm"

      - name: Stage package and checksums
        id: stage
        run: |
          mkdir -p release
          package_path="$(find packaging -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          test -n "$package_path"
          cp "$package_path" release/
          cp packaging/PKGBUILD packaging/purple-music.SRCINFO release/
          cp LICENSE LICENSE-AGPL-3.0-or-later THIRD_PARTY_NOTICES.md release/
          package_name="$(basename "$package_path")"
          printf 'package=%s\n' "release/$package_name" >> "$GITHUB_OUTPUT"
          printf 'package_name=%s\n' "$package_name" >> "$GITHUB_OUTPUT"

      - name: Prepare the shipped dependency view
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          scan_root="$GITHUB_WORKSPACE/sbom-input"
          deploy_root="$(mktemp -d)"
          source_root="$GITHUB_WORKSPACE/packaging/src/purple-$RELEASE_VERSION"
          mkdir -p "$scan_root/package" "$scan_root/javascript"
          bsdtar -xf "${{ steps.stage.outputs.package }}" -C "$scan_root/package"
          node "$GITHUB_WORKSPACE/packaging/src/package/bin/pnpm.cjs" \
            --dir "$source_root" \
            --filter purple \
            deploy --prod --legacy \
            --offline \
            --store-dir "$GITHUB_WORKSPACE/packaging/src/pnpm-store" \
            "$deploy_root"
          cp -a "$deploy_root/node_modules" "$scan_root/javascript/"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        env:
          SYFT_SOURCE_NAME: purple-music
          SYFT_SOURCE_VERSION: ${{ steps.version.outputs.value }}
        with:
          path: sbom-input
          config: .github/syft-release.yaml
          format: spdx-json
          output-file: release/purple-music.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SPDX dependency inventory
        run: |
          jq -e '
            def purls($prefix):
              [.packages[].externalRefs[]?.referenceLocator
               | select(startswith($prefix))] | unique | length;
            (.spdxVersion == "SPDX-2.3") and
            (purls("pkg:npm/") >= 25) and
            (purls("pkg:cargo/") >= 100) and
            (any(.packages[]; .name == "@strudel/web")) and
            (any(.packages[]; .name == "react")) and
            (any(.packages[]; .name == "tauri")) and
            (any(.packages[]; .name == "reqwest"))
          ' release/purple-music.spdx.json >/dev/null
          jq -r '
            def purls($prefix):
              [.packages[].externalRefs[]?.referenceLocator
               | select(startswith($prefix))] | unique | length;
            "SBOM dependency inventory: \(purls("pkg:npm/")) npm, \(purls("pkg:cargo/")) Cargo"
          ' release/purple-music.spdx.json

      - name: Generate SHA-256 checksums
        run: |
          cd release
          sha256sum \
            "${{ steps.stage.outputs.package_name }}" \
            purple-music.spdx.json \
            LICENSE \
            LICENSE-AGPL-3.0-or-later \
            THIRD_PARTY_NOTICES.md \
            PKGBUILD \
            purple-music.SRCINFO > SHA256SUMS

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*

      - name: Attest package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/${{ steps.stage.outputs.package_name }}
          sbom-path: release/purple-music.spdx.json

      - name: Keep a workflow copy of release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: purple-music-${{ github.ref_name }}-x86_64
          if-no-files-found: error
          path: |
            release/*

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --generate-notes \
              --title "Purple ${RELEASE_TAG#v}" \
              --verify-tag
          fi
