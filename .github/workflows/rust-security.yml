name: Rust Security

on:
  push:
    paths:
      - ".github/workflows/rust-security.yml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
  pull_request:
    paths:
      - ".github/workflows/rust-security.yml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  issues: write

concurrency:
  group: rust-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Rust advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Tauri's current GTK3 family requires glib 0.18. RUSTSEC-2024-0429 is
      # limited to VariantStrIter and is tracked in repository issue #22 until
      # Tauri's GTK4 migration makes glib 0.20+ selectable. All other security
      # advisories fail the check. Informational warnings remain non-failing.
      - name: Audit locked Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
          working-directory: src-tauri
          ignore: RUSTSEC-2024-0429
