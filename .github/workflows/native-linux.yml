name: Native Linux

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Arch Linux check
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install current Arch build dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          appstream
          chromium
          corepack
          desktop-file-utils
          git
          gst-plugins-base
          gst-plugins-good
          gtk3
          libsecret
          nodejs
          rust
          webkit2gtk-4.1

      - name: Enable the repository-pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Fetch locked dependencies
        run: |
          pnpm install --frozen-lockfile
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Parse the Arch package recipe
        run: |
          bash -n packaging/PKGBUILD
          (cd packaging && makepkg --printsrcinfo >/dev/null)

      - name: Run project checks offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: pnpm run check

      - name: Verify AudioWorklet under the production CSP
        run: node scripts/verify-worklet-csp.mjs

      - name: Build the native release binary offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo build --frozen --release --manifest-path src-tauri/Cargo.toml

      - name: Validate Linux desktop metadata
        run: |
          desktop-file-validate packaging/com.soundspurple.Purple.desktop
          appstreamcli validate --no-net packaging/com.soundspurple.Purple.metainfo.xml

      - name: Ensure dependency locks stayed unchanged
        run: git diff --exit-code -- pnpm-lock.yaml src-tauri/Cargo.lock
