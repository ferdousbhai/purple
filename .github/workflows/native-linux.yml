name: Native Linux

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Arch Linux check
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install current Arch build dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          appstream
          chromium
          corepack
          desktop-file-utils
          git
          gst-plugins-base
          gst-plugins-good
          gtk3
          libsecret
          nodejs
          rust
          webkit2gtk-4.1

      - name: Enable the repository-pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Fetch locked dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          pnpm install --frozen-lockfile
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Parse the Arch package recipe
        run: |
          bash -n packaging/PKGBUILD
          useradd --create-home package-checker
          chown package-checker:package-checker packaging
          runuser -u package-checker -- bash -c "cd '$GITHUB_WORKSPACE/packaging' && makepkg --printsrcinfo >/dev/null"

      - name: Run project checks offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: pnpm run check

      - name: Run browser flow smoke tests
        env:
          CHROMIUM_PATH: /usr/bin/chromium
        run: pnpm --filter @purple/web run test:browser

      - name: Verify AudioWorklet under the production CSP
        run: node scripts/verify-worklet-csp.mjs

      - name: Build the native release binary offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo build --frozen --release --manifest-path src-tauri/Cargo.toml

      - name: Validate Linux desktop metadata
        run: |
          desktop-file-validate packaging/com.soundspurple.Purple.desktop
          appstreamcli validate --no-net packaging/com.soundspurple.Purple.metainfo.xml

      - name: Ensure dependency locks stayed unchanged
        # `git diff` silently becomes a no-index comparison when a container
        # step loses the checkout working directory. Anchor it explicitly so
        # the two lockfiles are checked against the index, not against each other.
        run: >-
          git -C "$GITHUB_WORKSPACE" diff --exit-code --
          pnpm-lock.yaml src-tauri/Cargo.lock
